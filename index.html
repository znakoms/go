<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#32196e">
  <title>Открыть ссылку</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #241847; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: calc(84px + env(safe-area-inset-top)) 20px calc(42px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      background: linear-gradient(165deg, #241944 0%, #321864 47%, #5022a2 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      text-align: center;
    }
    main { width: min(100%, 500px); }
    h1, p { margin: 0; }
    h1 {
      font-size: clamp(27px, 6.8vw, 39px);
      line-height: 1.53;
      letter-spacing: .025em;
      font-weight: 850;
    }
    .instructions {
      margin: 22px auto 0;
      max-width: 430px;
      font-size: clamp(18px, 4.8vw, 24px);
      line-height: 1.5;
      font-weight: 500;
      color: #d8cdfd;
    }
    .instructions strong {
      font-weight: 800;
      color: #ffffff;
      background: rgba(255,255,255,.12);
      padding: .08em .28em;
      border-radius: 10px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    .helper-gif-wrap {
      margin: 28px auto 0;
      display: flex;
      justify-content: center;
    }
    .helper-gif {
      display: block;
      width: min(56vw, 250px);
      height: auto;
      filter: drop-shadow(0 10px 24px rgba(8, 6, 25, .28));
      user-select: none;
      -webkit-user-drag: none;
    }
    .fingerprint-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 220px;
      height: 220px;
      margin: 28px auto 0;
      background: #fff;
      border-radius: 19px;
      box-shadow: 0 8px 22px rgba(10, 6, 34, .14);
      text-decoration: none;
      cursor: pointer;
      -webkit-touch-callout: default;
      touch-action: manipulation;
    }
    .fingerprint-link svg { display: block; width: 166px; height: 166px; pointer-events: none; }
    .fingerprint-link:focus-visible { outline: 4px solid #9bc6ff; outline-offset: 5px; }

    @media (max-height: 740px) {
      body { justify-content: flex-start; padding-top: calc(44px + env(safe-area-inset-top)); }
      h1 { line-height: 1.3; }
      .instructions { margin-top: 18px; }
      .helper-gif-wrap { margin-top: 20px; }
      .helper-gif { width: min(45vw, 200px); }
      .fingerprint-link { width: 188px; height: 188px; margin-top: 20px; }
      .fingerprint-link svg { width: 143px; height: 143px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>📢 УДЕРЖИВАЙТЕ<br>ПАЛЕЦ НА ОТПЕЧАТКЕ!</h1>
    <p class="instructions">Выберите <strong>"Открыть ссылку (в браузере)"</strong>.</p>

    <div class="helper-gif-wrap">
      <img class="helper-gif" src="fingerprint-transparent.gif" alt="Подсказка для удержания пальца">
    </div>

    <!-- Replace the href below with YOUR actual destination URL. -->
    <a class="fingerprint-link"
       href="https://w7b2hr3.idealpartnership.org/cxu8mm9"
       aria-label="Открыть внешний сайт по ссылке">
      <svg viewBox="0 0 200 200" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
        <circle cx="100" cy="100" r="98" fill="#ed4058"/>
        <g fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M47 96c0-29 24-53 53-53s53 24 53 53"/>
          <path d="M34 94c0-36 30-66 66-66s66 30 66 66"/>
          <path d="M60 112V97c0-22 18-40 40-40s40 18 40 40v19"/>
          <path d="M73 126V97c0-15 12-27 27-27s27 12 27 27v33"/>
          <path d="M86 143V97c0-8 6-14 14-14s14 6 14 14v44"/>
          <path d="M48 116c0 24 7 43 21 56"/>
          <path d="M61 136c3 14 10 26 19 34"/>
          <path d="M100 98v34c0 16 5 31 16 44"/>
          <path d="M128 145c1 12 6 22 12 31"/>
          <path d="M141 128c0 14 5 26 11 36"/>
        </g>
      </svg>
    </a>
  </main>
</body>
</html>
